; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328new

[env]
monitor_speed = 115200

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = powerbroker2/SerialTransfer@3.1.5
test_ignore =
    buffers/test_buffers
    chain/test_chain
    core/test_clock_cycles
    core/test_dr
    core/test_ir
    backends/gpio/test_gpio
    profiles/test_stm32_profile
    boundary/test_boundary
    protocol/test_protocol

; Host tests use a simulated JTAG bus and require a local C++ compiler.
[env:native]
platform = native
test_framework = unity
test_filter =
    buffers/test_buffers
    chain/test_chain
    core/test_clock_cycles
    core/test_dr
    core/test_ir
    backends/gpio/test_gpio
    profiles/test_stm32_profile
    boundary/test_boundary
    protocol/test_protocol
test_build_src = no
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Werror
    -Itest/support

[env:native_sanitized]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g

; Adapter preset; SerialTransfer is inherited from the base Nano environment.
[env:nano_serial]
extends = env:nanoatmega328new
build_flags = -DARDUJTAG_SERIAL_ADAPTER
